name: Feature A validation

on:
  push:
    branches:
      - feat/file-change-approvals

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build companion and enforce file-change boundary
        shell: powershell
        run: |
          .\Test-CodexFileChangeApprovalContract.ps1

      - name: Check mobile JavaScript syntax
        shell: powershell
        run: |
          node --check .\mobile\app.js

      - name: Build gateway and mobile server
        shell: powershell
        run: |
          .\BuildCodexLanGateway.ps1
          .\BuildCodexMobileUiServer.ps1
